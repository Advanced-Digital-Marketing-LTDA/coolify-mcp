name: OSSAR

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '32 23 * * 5'

permissions:
  contents: read

jobs:
  OSSAR-Scan:
    # Preserve the check name previously produced by the reusable workflow.
    name: OSSAR-Scan / OSSAR-Scan
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: windows-latest
    env:
      SECURITY_LINT_ROOT: ${{ runner.temp }}/ossar-eslint
      # Guardian's supported override replaces only ESLint's configuration file.
      GDN_ESLINT_CONFIGURATIONFILE: ${{ github.workspace }}/.github/ossar-eslint.config.mjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; original OSSAR checkout
        with:
          persist-credentials: false

      - name: Set up Node for the security parser
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install isolated security configuration dependencies
        shell: pwsh
        run: |
          npm install --ignore-scripts --no-save --prefix "$env:SECURITY_LINT_ROOT" --registry https://registry.npmjs.org eslint@9.39.2 @microsoft/eslint-plugin-sdl@1.0.1 @typescript-eslint/parser@8.72.0 typescript@5.9.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep the original OSSAR policy and automatic applicability for every tool.
      - name: Run OSSAR
        uses: github/ossar-action@786a16a90ba92b4ae6228fe7382fb16ef5c51000 # v1, resolved from the failed run
        id: ossar

      - name: Upload OSSAR results
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3, resolved from the failed run
        with:
          sarif_file: ${{ steps.ossar.outputs.sarifFile }}
