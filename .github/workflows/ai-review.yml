name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both jobs need the CLAUDE_CODE_OAUTH_TOKEN repository secret. Without it (or on a
# fork PR, which gets no secrets) they skip with a notice instead of failing.
jobs:
  adversarial-review:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping adversarial-review."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - if: env.HAS_KEY == 'true'
        name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.301
      - if: env.HAS_KEY == 'true'
        name: adversarial-review --passes 2 --verify
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          npx --yes adversarial-review@2.11.1 --provider claude --base "origin/$BASE_REF" \
            --passes 2 --verify --fail-on-empty | tee -a "$GITHUB_STEP_SUMMARY"

  pr-review-toolkit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping PR Review Toolkit."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: pr-review-toolkit@claude-code-plugins
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Run /pr-review-toolkit:review-pr all on this pull request; its changes are
            the output of `gh pr diff`. Post specific issues as inline comments and
            one summary comment with the findings.
          claude_args: |
            --allowedTools "Task,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
