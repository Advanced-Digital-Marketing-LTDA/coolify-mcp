name: rewardguard

on:
  pull_request:
  push:

jobs:
  rewardguard:
    uses: Advanced-Digital-Marketing-LTDA/workflows/.github/workflows/rewardguard.yml@b9403b4ab4f5e3cf09ab7c4f934aab2d6723c14e # complete PR context and merge-base coverage
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      run-tests: false
      node-version: '24'
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
