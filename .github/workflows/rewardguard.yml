name: rewardguard

on:
  pull_request:
  push:

jobs:
  rewardguard:
    uses: Advanced-Digital-Marketing-LTDA/workflows/.github/workflows/rewardguard.yml@91003c38da83d57499bef6698b81fa53fb9d6c18 # complete PR context and merge-base coverage
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      run-tests: false
      node-version: '24'
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
