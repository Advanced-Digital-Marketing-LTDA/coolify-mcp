name: rewardguard

on:
  pull_request:
  push:

jobs:
  rewardguard:
    uses: Advanced-Digital-Marketing-LTDA/workflows/.github/workflows/rewardguard.yml@3fef860068aafe62e5b35b13edbc280dc850f19c # PR title and description context for code and content review
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      run-tests: false
      node-version: '24'
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
