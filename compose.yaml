services:
  mcp:
    build:
      context: .
      target: runtime
    image: coolify-mcp:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      MCP_PUBLIC_ORIGIN: ${MCP_PUBLIC_ORIGIN:?Set the final HTTPS MCP origin}
      MCP_TRUSTED_PROXY_CIDRS: ${MCP_TRUSTED_PROXY_CIDRS:?Set actual ingress IPs/CIDRs}
      COOLIFY_ORIGIN: ${COOLIFY_ORIGIN:?Set the confirmed HTTPS Coolify origin}
      COOLIFY_TARGET_SERVER_NAME: ${COOLIFY_TARGET_SERVER_NAME:?Set the approved server name}
      COOLIFY_TARGET_SERVER_UUID: ${COOLIFY_TARGET_SERVER_UUID:?Set the approved server UUID}
      COOLIFY_OWNER_SUBJECT: ${COOLIFY_OWNER_SUBJECT:?Set the stable owner subject}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set the owner-selected HTTPS OIDC issuer}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the owner-selected client ID}
      # Runtime pass-through from the deployment secret manager; never build args or files.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Inject the runtime OIDC client secret}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:?Inject the runtime team token}
    deploy:
      replicas: 1
    stop_grace_period: 10s
